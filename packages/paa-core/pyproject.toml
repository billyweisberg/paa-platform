[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paa-core"
version = "0.1.0"
description = "Shared core utilities for the PAA platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<1.0",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
