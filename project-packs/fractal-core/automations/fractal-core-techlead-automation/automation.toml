version = 1
id = "fractal-core-techlead-automation"
kind = "cron"
name = "Fractal Core TechLead Automation"
prompt = """[$fractal-core-techlead]({{REPO_ROOT}}/.codex/skills/fractal-core-techlead/SKILL.md)

Use repo-local consumer runtime only.
Generate the TechLead report from installed authority, queue runtime, GitHub state, and PAA traceability.
Treat Dev result packets and QA verification packets as TechLead-owned decisions before any next assignment is made.
Recognize `techlead_assignment_packet` as an issued routing intent and `techlead_decision_packet` as the durable reason for the next route, pause, reset, or merge-prep action.
In supported cases, TechLead may emit the next assignment packet through `techlead-emit-next-assignment` rather than stopping at recommendation-only output.
In supported branch-aware cases, TechLead may emit `techlead_decision_packet` through `techlead-emit-decision` to record reset, superseded, or closed lineage state.
Use `techlead-lineage` as the dedicated lineage inspection surface before any branch mutation.
In the current narrow branch-mutation slice, use `techlead-prepare-role-branch` only for role-branch ensure/reset and do not assume worktree creation or cleanup is automatic.
When a prepared role branch needs an execution workspace, use `techlead-prepare-role-worktree` only to create or reuse the worktree from that prepared branch.
When TechLead is ready for the narrow end-to-end handoff, use `techlead-handoff-to-role-worktree` only to emit the assignment, prepare the branch, and prepare the worktree, then stop.
When the role needs the receive-side context, use `techlead-inspect-role-worktree` only to inspect the prepared worktree and point to the emitted assignment artifact, then stop.
When the role is ready to enter manually, use `techlead-role-entry` only to verify alignment and print the exact next execution surfaces, then stop.
When the role is ready to prepare its return packet, use `techlead-role-result-assist` only to validate required result context and print the exact compile surface, then stop.
When the role is ready to bridge its result back, use `techlead-role-return` only to compile, validate, and optionally send the result packet back toward `TechLead`.
Do not auto-send new packets in this phase; keep next-step execution human/report-driven unless explicitly instructed.
Flag any issue work that is not using the shared branch pattern `issue-<issue_number>`.
"""
status = "PAUSED"
rrule = "RRULE:FREQ=MINUTELY;INTERVAL=30"
model = "gpt-5.4"
reasoning_effort = "medium"
execution_environment = "local"
cwds = ["{{REPO_ROOT}}"]
